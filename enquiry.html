<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crave House | Enquiry</title>

    <link rel="stylesheet" href="/CSS/styles.css">
</head>

<body>

    <!-- Header -->
    <header>

        
        </div>

        <div class="logo">
            <h1>Crave House</h1>
            <p>Snacks for Every Craving</p>
        </div>

        <!-- Main navigation -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>


    <!-- Main content -->
    <main>

        <section class="page-title">

            <h2>Product Enquiry</h2>

            <p>
                Complete the form below to enquire about a product.
            </p>

        </section>


        <!-- Enquiry form -->
        <section class="form-section">

            <form id="enquiryForm">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >


                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                >


                <label for="product">Select a Product</label>

                <select
                    id="product"
                    name="product"
                    required
                >

                    <option value="">Select a product</option>

                    <option value="Potato Chips">
                        Potato Chips
                    </option>

                    <option value="Popcorn">
                        Popcorn
                    </option>

                    <option value="Chocolate Bar">
                        Chocolate Bar
                    </option>

                    <option value="Mixed Sweets">
                        Mixed Sweets
                    </option>

                    <option value="Biscuits">
                        Biscuits
                    </option>

                    <option value="Cupcake">
                        Cupcake
                    </option>

                    <option value="Cold Drink">
                        Cold Drink
                    </option>

                    <option value="Fruit Juice">
                        Fruit Juice
                    </option>

                </select>


                <label for="quantity">Quantity</label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    required
                >


                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                ></textarea>


                <button type="submit">
                    Submit Enquiry
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>&copy; 2026 Crave House. All Rights Reserved.</p>

       

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
